name: Scheduled Email Task

on:
  schedule:
    - cron: '*/5 * * * *'  # Run every 5 minutes for testing.

jobs:
  run_script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'  # Change if necessary.

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # Make sure you have a requirements.txt file.

      - name: Run Python script
        run: python send_email.py  # Replace with your Python script name.
